name: bazel

permissions:
  contents: read

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

concurrency:
  group: bazel-ref
  cancel-in-progress: true

jobs:
  build:
    name: bazel build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: enabled
          repository-cache: true

      - name: Build libzstd
        run: bazel build //lib:zstd
